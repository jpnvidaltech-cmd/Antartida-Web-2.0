version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antartidalabs-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-http://localhost:3000}
      - CONTACT_SECRET=${CONTACT_SECRET:-clave_secreta_local}
      - CONTACT_RECIPIENT=${CONTACT_RECIPIENT:-contacto@antartidalabs.com}
      - CONTACT_SENDER=${CONTACT_SENDER:-no-reply@antartidalabs.com}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
    env_file:
      - .env
