<svg xmlns="http://www.w3.org/2000/svg" width="1092" height="1092" viewBox="0 0 1092 1092" role="img" aria-labelledby="title desc">
  <title id="title">Antártida Labs</title>
  <desc id="desc">Logo vectorial: pingüino con circuitos sobre una plataforma de hielo y una estrella polar. Versión optimizada para fondo oscuro.</desc>
  <defs>
    <!-- body-left: head top and chest outline -->
    <linearGradient id="body-left-dark" gradientUnits="userSpaceOnUse" x1="0" y1="290" x2="0" y2="805">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".25" stop-color="#E0F2FE"/>
      <stop offset=".45" stop-color="#09E5E9"/>
      <stop offset=".70" stop-color="#048CF2"/>
      <stop offset="1" stop-color="#005A9C"/>
    </linearGradient>

    <!-- body-foot: feet and belly -->
    <linearGradient id="body-foot-dark" gradientUnits="userSpaceOnUse" x1="0" y1="730" x2="0" y2="816">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".40" stop-color="#09E5E9"/>
      <stop offset="1" stop-color="#048CF2"/>
    </linearGradient>

    <!-- circuit: circuit lines -->
    <linearGradient id="circuit-dark" gradientUnits="userSpaceOnUse" x1="0" y1="590" x2="0" y2="815">
      <stop offset="0" stop-color="#09E5E9"/>
      <stop offset=".35" stop-color="#04EBF5"/>
      <stop offset=".75" stop-color="#048CF2"/>
      <stop offset="1" stop-color="#005A9C"/>
    </linearGradient>

    <!-- circuit-short -->
    <linearGradient id="circuit-short-dark" gradientUnits="userSpaceOnUse" x1="0" y1="695" x2="0" y2="814">
      <stop offset="0" stop-color="#09E5E9"/>
      <stop offset=".70" stop-color="#04D3E8"/>
      <stop offset="1" stop-color="#048CF2"/>
    </linearGradient>

    <!-- eye -->
    <linearGradient id="eye-dark" gradientUnits="userSpaceOnUse" x1="539" y1="331" x2="514" y2="367">
      <stop offset="0" stop-color="#09E5E9"/>
      <stop offset=".50" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- ice-top -->
    <linearGradient id="ice-top-dark" gradientUnits="userSpaceOnUse" x1="246" y1="808" x2="821" y2="870">
      <stop offset="0" stop-color="#09E5E9"/>
      <stop offset=".30" stop-color="#048CF2"/>
      <stop offset=".70" stop-color="#005A9C"/>
      <stop offset="1" stop-color="#048CF2"/>
    </linearGradient>

    <!-- ice-side -->
    <linearGradient id="ice-side-dark" gradientUnits="userSpaceOnUse" x1="0" y1="806" x2="0" y2="928">
      <stop offset="0" stop-color="#09E5E9"/>
      <stop offset=".50" stop-color="#048CF2"/>
      <stop offset="1" stop-color="#005A9C"/>
    </linearGradient>

    <!-- ice-back -->
    <linearGradient id="ice-back-dark" gradientUnits="userSpaceOnUse" x1="0" y1="746" x2="0" y2="817">
      <stop offset="0" stop-color="#048CF2"/>
      <stop offset=".50" stop-color="#09E5E9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- back-foot -->
    <linearGradient id="back-foot-dark" gradientUnits="userSpaceOnUse" x1="0" y1="726" x2="0" y2="802">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".50" stop-color="#09E5E9"/>
      <stop offset="1" stop-color="#048CF2"/>
    </linearGradient>

    <!-- compass-ring: polar star -->
    <radialGradient id="compass-ring-dark" cx="762.5" cy="216.3" r="111" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.30" stop-color="#E0F2FE"/>
      <stop offset="0.65" stop-color="#09E5E9"/>
      <stop offset="1" stop-color="#048CF2"/>
    </radialGradient>
  </defs>

  <!-- Ice platform -->
  <g id="ice" fill="none" stroke-width="6.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M317.7 777.4 218.8 805.0 234.4 856.6 324.1 893.9 447.3 901.6 497.8 928.3 627.1 892.9 727.2 898.2 853.5 861.3 872.8 812.5" stroke="url(#ice-side-dark)"/>
    <path d="M587.7 746.6 658.8 766.4 723.2 772.1 754.6 786.2 872.8 812.5" stroke="url(#ice-back-dark)"/>
    <path d="M218.8 805.0 297.6 833.4 357.4 845.1 429.3 847.4 502.5 872.3 651.5 831.5 741.0 844.7 872.8 812.5" stroke="url(#ice-top-dark)"/>
    <path d="M297.6 833.4 324.1 893.9 357.4 845.1 M429.3 847.4 447.3 901.6 M502.5 872.3 497.8 928.3 M595.1 847.0 587.1 903.9 M651.5 831.5 627.1 892.9 M741.0 844.7 727.2 898.2 M788.0 833.2 778.7 883.1" stroke="url(#ice-top-dark)"/>
  </g>

  <!-- Penguin -->
  <g id="penguin" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M413.0 777.2 C386.3 792.3 352.2 800.5 315.4 803.5 C336.8 776.2 357.8 738.7 363.0 704.8 C369.0 662.3 371.0 609.0 381.7 570.0 C393.2 528.0 422.6 478.6 443.5 440.0 C454.5 420.0 456.4 401.5 459.5 377.0 C463.96 332.55 492.71 291.28 540.0 289.9 C553.8 289.9 564.4 294.0 576.8 299.3 L649.3 277.5 L601.1 325.8" stroke="url(#body-left-dark)" stroke-width="7.5"/>
    <!-- BACK OF PENGUIN: Pure crisp white for maximum contrast on dark navy -->
    <path d="M601.1 325.8 C586.7 353.0 579.8 376.9 585.1 400.4 C589.4 423.4 605.5 441.4 613.0 468.0 C624.5 508.3 626.5 557.5 618.6 600.0 C610.6 648.6 593.0 688.0 568.3 716.9 C543.3 745.8 508.7 760.3 464.1 768.6" stroke="#FFFFFF" stroke-width="7.5"/>
    <path d="M583.4 378.1 C550.2 390.0 526.0 409.8 512.9 435.9 C528.6 482.3 537.3 521.4 529.7 568.4 C525.8 597.0 515.3 621.5 501.1 643.0 C498.4 663.7 499.6 690.1 495.2 710.7 C486.8 735.9 475.3 751.2 464.1 768.6 C459.6 774.2 471.2 778.4 481.7 786.1 L493.7 792.0 Q500.1 798.5 504.2 810.8 L461.9 816.2" stroke="url(#body-foot-dark)" stroke-width="7.5"/>
    <!-- INNER BACK: Ice subtle cyan #E0F2FE -->
    <path d="M493.0 458.0 C508.8 513.8 504.7 570.2 482.0 619.1 C470.8 644.9 454.3 667.5 437.0 684.1" stroke="#E0F2FE" stroke-width="7.5"/>
    <!-- WING CONTOUR: White #FFFFFF -->
    <path d="M629.4 486.5 C652.0 522.2 667.1 559.0 668.7 595.2 C670.2 624.6 665.4 651.0 655.0 675.5 C650.8 650.4 640.4 624.1 628.9 607.0" stroke="#FFFFFF" stroke-width="7.5"/>
    <path d="M510.0 366.8 532.4 319.7 560.6 358.3 542.2 354.2Z" stroke="url(#eye-dark)" stroke-width="7.5"/>
    <path d="M592.0 704.6 569.4 760.3 605.6 773.7 Q614.4 776.6 625.4 794.3 L593.5 798.3 M523.0 762.0 528.0 787.1 591.7 801.5" stroke="url(#back-foot-dark)" stroke-width="7.0" stroke-linecap="butt"/>
  </g>

  <!-- Circuits -->
  <g id="circuits" fill="none" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="421.5" cy="566.1" r="7.2" stroke="#09E5E9"/>
    <path d="M421.4 573.5 420.5 622.9 392.1 651.3 391.1 742.6 360.6 776.4" stroke="url(#circuit-dark)"/>
    <circle cx="456.8" cy="523.9" r="7.1" stroke="#09E5E9"/>
    <path d="M456.7 531.0 456.2 594.2 445.0 605.2 445.0 635.4 415.4 664.7 414.8 769.1 411.0 786.9 414.3 801.6 461.9 816.2" stroke="url(#circuit-dark)"/>
    <circle cx="464.7" cy="694.8" r="7.2" stroke="#09E5E9"/>
    <path d="M459.6 700.1 439.0 721.0 438.6 782.5 462.6 804.6 460.4 813.9" stroke="url(#circuit-short-dark)" stroke-width="7.0"/>
    <path d="M458.0 781.3 485.7 802.4 Q489.5 808.1 487.6 812.4" stroke="url(#circuit-short-dark)" stroke-width="6.8"/>
    <path d="M497.0 781.6 516.3 778.2" stroke="#09E5E9" stroke-width="6.5"/>
    <path d="M562.1 774.8 583.1 787.6 Q591.4 793.1 591.7 799.4 M578.2 774.3 605.9 787.8" stroke="#09E5E9" stroke-width="6.5"/>
  </g>

  <!-- Polar Star -->
  <g id="compass-star" aria-label="Rosa de los vientos">
    <path fill="url(#compass-ring-dark)" fill-rule="evenodd" d="
      M 762.5 103.8
      L 775.1 196.8 811.3 169.2 784.0 205.5
      L 868.4 216.4 784.3 227.7 811.3 263.1 775.0 235.8
      L 762.5 320.9 750.5 235.4 713.8 263.2 741.6 227.8
      L 657.7 216.2 741.8 205.1 714.6 169.3 750.6 196.7 Z
      M 762.5 139.0
      L 753.7 202.4 735.0 189.0 747.0 208.7
      L 694.3 216.2 746.1 223.9 734.0 244.0 753.4 230.7
      L 762.4 286.7 771.9 230.9 791.0 244.0 779.4 223.9
      L 832.6 216.4 779.3 208.7 790.0 189.0 772.1 202.0 Z"/>
    <!-- Center diamond of polar star: crisp pure white #FFFFFF for high contrast -->
    <path fill="#FFFFFF" d="
      M 762.4 171.0
      L 767.9 205.4 Q 768.0 207.5 770.1 206.3
      L 778.9 200.4 772.4 209.0 Q 771.0 211.0 773.4 211.5
      L 806.1 216.3 773.1 220.5 Q 771.1 220.8 772.4 223.0
      L 777.7 230.0 769.0 224.8 Q 767.7 224.0 767.4 226.0
      L 762.7 259.8 757.1 225.8 Q 756.9 224.0 755.0 225.3
      L 747.9 230.1 753.7 222.0 Q 754.6 220.5 752.4 220.2
      L 717.9 216.2 752.5 211.4 Q 754.8 211.1 753.5 209.2
      L 746.5 200.6 755.8 207.0 Q 757.4 208.1 757.8 205.9 Z"/>
  </g>
</svg>
